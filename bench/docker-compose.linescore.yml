services:
  afl-dafl-1:
    container_name: "${CVE}-afl-dafl-1"
    build:
      context: "./${CVE}"
      dockerfile: Dockerfile.linescore
      args:
        - REGISTRY=${REGISTRY:-docker.io/location0717}
    image: "${IMAGE_NAME_LINESCORE:-${CVE}:linescore}"
    command: bash -c "bash script.sh && sleep infinity"
    working_dir: /workspace
    pid: "host"
    environment:
      - TARGET_BIN=${TARGET_BIN_DAFL}
      - TARGET_ARGS=${TARGET_ARGS}
      - TARGET_BIN_ASAN=${TARGET_BIN_ASAN}
      - FUZZER_BIN=afl-fuzz
      - FUZZER_ROLE=M
      - FUZZER_NAME=main
      - SESSION_ID=${SESSION_ID}
      - TRIAL_NAME=${TRIAL_NAME}
      - CONTAINER_NAME=${CVE}-afl-dafl-1
    volumes:
      - "afl-out-dafl-1:/workspace/out"
      - "./script.sh:/workspace/script.sh:ro"
      - "../../artifact/${CVE}/${TRIAL_NAME}/logs:/workspace/logs"
    deploy:
      resources:
        limits:
          memory: 1.5G

  afl-attention-1:
    container_name: "${CVE}-afl-attention-1"
