[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "target-graph"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
    { name = "NYCU Systems & Security Lab" }
]
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "networkx>=3.0.0",
    "transformers>=4.35.0",
    "tree-sitter>=0.21.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

